; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:seeed_xiao_esp32s3]
platform = espressif32@6.12.0
platform_packages = framework-arduinoespressif32@3.20017.241212
board = seeed_xiao_esp32s3
board_build.partitions = partitions_cuelink.csv
framework = arduino
monitor_speed = 115200
monitor_dtr = 1
monitor_rts = 1
build_unflags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
	-DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
	-DMYNEWT_VAL_BLE_SM_LEGACY=0
	-DCONFIG_BT_NIMBLE_SM_LVL=4
	-DCONFIG_BT_NIMBLE_SM_SC_ONLY=1
	-DCONFIG_BT_NIMBLE_LOG_LEVEL=0
	-DARDUINO_USB_MODE=0
	-DARDUINO_USB_CDC_ON_BOOT=0
lib_deps =
	olikraus/U8g2@2.36.17
	h2zero/NimBLE-Arduino@2.3.9
	bblanchon/ArduinoJson@6.21.5
